name: WeddingRank manual official room metadata batch 18
on:
  push:
    paths:
      - 'research/patches/2026-10-16-manual-official-room-metadata-batch-18.json'
      - 'scripts/apply-verified-official-room-metadata-batch-18.cjs'
      - '.github/workflows/manual-official-metadata-batch-18.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: weddingrank-manual-room-metadata-18
  cancel-in-progress: false
jobs:
  verify_and_apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install --no-save @supabase/supabase-js@2.57.4
      - name: Recheck official room evidence and update WeddingRank source DB
        env:
          SUPABASE_URL: https://mozmxkmaynhxqwzovzhi.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/apply-verified-official-room-metadata-batch-18.cjs
      - name: Keep source original values and verified outcome proof
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: weddingrank-manual-official-room-batch-18
          path: weddingrank-batch-18-proof.json
          if-no-files-found: warn
          retention-days: 30
