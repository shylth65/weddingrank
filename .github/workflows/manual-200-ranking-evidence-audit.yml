name: WeddingRank manual 200 verified rankings evidence audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/audit-200-ranked-halls.cjs'
      - '.github/workflows/manual-200-ranking-evidence-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install --no-save @supabase/supabase-js@2.57.4
      - name: Verify WeddingRank 200 goal evidence stages without DB mutation
        env:
          SUPABASE_URL: https://mozmxkmaynhxqwzovzhi.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/audit-200-ranked-halls.cjs
      - name: Upload 200 candidate evidence research queue
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: weddingrank-ranking-200-evidence-queue
          path: weddingrank-200-ranking-evidence-queue.json
          retention-days: 14
