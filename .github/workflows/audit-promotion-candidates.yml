name: WeddingRank promotion candidate audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/audit-promotion-candidates.cjs'
      - '.github/workflows/audit-promotion-candidates.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save @supabase/supabase-js@2.57.4
      - name: Audit promotion candidates
        env:
          SUPABASE_URL: https://mozmxkmaynhxqwzovzhi.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/audit-promotion-candidates.cjs
