name: WeddingRank manual verified 200-goal directory batch 4
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/apply-official-directory-expansion-batch-4.cjs'
      - 'research/patches/2026-10-12-public-directory-expansion-batch-4.json'
      - '.github/workflows/manual-public-directory-expansion-batch-4.yml'
permissions:
  contents: read
concurrency:
  group: weddingrank-verified-manual-expansion-batch-4
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install --no-save @supabase/supabase-js@2.57.4
      - name: Publish verified WeddingRank directory venues only
        env:
          SUPABASE_URL: https://mozmxkmaynhxqwzovzhi.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/apply-official-directory-expansion-batch-4.cjs
