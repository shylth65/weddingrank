name: WeddingRank manual official venue phone corrections
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/patches/2026-10-12-official-profile-phones.json'
      - '.github/workflows/manual-official-phone-corrections.yml'
permissions:
  contents: read
concurrency:
  group: weddingrank-manual-official-phone-corrections
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install --no-save @supabase/supabase-js@2.57.4
      - name: Apply guarded WeddingRank-only profile corrections
        env:
          SUPABASE_URL: https://mozmxkmaynhxqwzovzhi.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/apply-verified-wedding-patches.cjs research/patches/2026-10-12-official-profile-phones.json
