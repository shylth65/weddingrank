name: WeddingRank held Jinzza discovery

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/discover-held-jinzza.cjs'
      - '.github/workflows/discover-held-jinzza.yml'

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Discover individual numeric review URLs
        run: node scripts/discover-held-jinzza.cjs
