name: WeddingRank approved review aggregation

on:
  workflow_dispatch:
  schedule:
    # 03:40 KST daily
    - cron: '40 18 * * *'
  push:
    paths:
      - 'scripts/aggregate-approved-reviews.cjs'
      - 'scripts/daily-live-smoke-qa.cjs'
      - '.github/workflows/approved-review-aggregation.yml'

permissions:
  contents: read

concurrency:
  group: weddingrank-approved-reviews
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install --no-save @supabase/supabase-js@2.57.4
      - name: Aggregate reviewed independent sources
        env:
          SUPABASE_URL: https://mozmxkmaynhxqwzovzhi.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/aggregate-approved-reviews.cjs

      - name: Decide weekly browser QA
        id: browser_qa
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "schedule" || "$(TZ=Asia/Seoul date +%u)" == "7" ]]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Install browser for live public-site QA
        if: success() && steps.browser_qa.outputs.run == 'true'
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify WeddingRank live list search detail and ranking (read-only)
        continue-on-error: true
        if: success() && steps.browser_qa.outputs.run == 'true'
        run: node scripts/daily-live-smoke-qa.cjs
