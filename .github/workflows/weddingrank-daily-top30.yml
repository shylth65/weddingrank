name: WeddingRank daily TOP30 data audit

on:
  schedule:
    # 08:00 Asia/Seoul every day (UTC previous day 23:00)
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weddingrank-daily-top30-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check syntax
        run: python -m py_compile scripts/weddingrank_daily_audit.py scripts/weddingrank_price_source_audit.py scripts/weddingrank_apply_verified_prices.py scripts/weddingrank_expansion_candidates.py scripts/weddingrank_publish_approved_venues.py scripts/weddingrank_outcome_scorecard.py scripts/weddingrank_auto_official_info.py
      - name: Inspect public data and limited official websites
        run: python scripts/weddingrank_daily_audit.py
      - name: Check stale price sources (read-only, limited requests)
        run: python scripts/weddingrank_price_source_audit.py
      - name: Apply verified price changes only when approved evidence and existing write credential are present
        env:
          WEDDINGRANK_PRICE_WRITE_KEY: ${{ secrets.WEDDINGRANK_PRICE_WRITE_KEY }}
        run: python scripts/weddingrank_apply_verified_prices.py
      - name: Review unpublished venue candidates daily (read-only)
        env:
          WEDDINGRANK_PRICE_WRITE_KEY: ${{ secrets.WEDDINGRANK_PRICE_WRITE_KEY }}
        run: python scripts/weddingrank_expansion_candidates.py
      - name: Publish individually approved and verified venues (maximum 10 per run)
        env:
          WEDDINGRANK_PRICE_WRITE_KEY: ${{ secrets.WEDDINGRANK_PRICE_WRITE_KEY }}
        run: python scripts/weddingrank_publish_approved_venues.py
      - name: Verify and save official practical info from matched official sites
        env:
          WEDDINGRANK_PRICE_WRITE_KEY: ${{ secrets.WEDDINGRANK_PRICE_WRITE_KEY }}
        run: python scripts/weddingrank_auto_official_info.py
      - name: Report actual database outcomes
        if: always()
        env:
          WEDDINGRANK_PRICE_WRITE_KEY: ${{ secrets.WEDDINGRANK_PRICE_WRITE_KEY }}
        run: python scripts/weddingrank_outcome_scorecard.py
      - name: Preserve audit results as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weddingrank-top30-daily-audit
          path: |
            reports/daily/
            reports/prices/
            reports/expansion/
          if-no-files-found: warn
          retention-days: 30
