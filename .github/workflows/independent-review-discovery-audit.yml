name: WeddingRank independent review discovery audit
on:
  push:
    paths:
      - '.github/workflows/independent-review-discovery-audit.yml'
  schedule:
    - cron: '0 0,4,8,12 * * *' # 09:00,13:00,17:00,21:00 KST only
permissions:
  contents: read
concurrency:
  group: weddingrank-independent-review-discovery
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install --no-save @supabase/supabase-js@2.57.4
      - name: Discover external individual review leads (read-only)
        env:
          SUPABASE_URL: https://mozmxkmaynhxqwzovzhi.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -o pipefail
          node scripts/discover-independent-review-bulk.cjs | tee review-discovery.log
      - name: Audit independent sources and unanalysed candidates (read-only)
        env:
          SUPABASE_URL: https://mozmxkmaynhxqwzovzhi.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -o pipefail
          node scripts/audit-independent-review-pipeline.cjs | tee review-eligibility.log
      - name: Stage independently analysed reviews for specialist approval (no public release)
        env:
          SUPABASE_URL: https://mozmxkmaynhxqwzovzhi.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/stage-qualitative-review-candidates.cjs
      - name: Verify WeddingRank AI key configured (do not disclose value)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error title=WeddingRank AI disabled::OPENAI_API_KEY is missing from this repository's Actions secrets. Candidate collection may run but AI approval and publication cannot proceed."
            exit 1
          fi
          echo "WeddingRank AI key is configured (value not printed)."
      - name: Analyse at most three new independent originals (pending only)
        env:
          SUPABASE_URL: https://mozmxkmaynhxqwzovzhi.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/analyze-new-wedding-review-candidates.cjs
      - name: Conservatively AI-verify previously analysed originals (max two per run)
        env:
          SUPABASE_URL: https://mozmxkmaynhxqwzovzhi.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MAX_AI_REVIEWS: '2'
        run: node scripts/verify-qualitative-ai-publication.cjs
      - name: Upload discovery and eligibility audit logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: weddingrank-independent-review-audit
          path: |
            review-discovery.log
            review-eligibility.log
          retention-days: 14

