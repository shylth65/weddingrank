name: WeddingRank Grand Ostium evidence correction
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/apply-grand-ostium-rating-evidence-hold.cjs'
      - '.github/workflows/manual-grand-ostium-rating-evidence-hold.yml'
permissions:
  contents: read
concurrency:
  group: weddingrank-grand-ostium-rating-evidence-hold
  cancel-in-progress: false
jobs:
  hold:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install --no-save @supabase/supabase-js@2.57.4
      - name: Withdraw unsupported external rank and preserve original evidence
        env:
          SUPABASE_URL: https://mozmxkmaynhxqwzovzhi.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/apply-grand-ostium-rating-evidence-hold.cjs
