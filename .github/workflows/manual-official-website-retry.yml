name: WeddingRank manual official website retry
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/patches/2026-10-12-retry-official-websites.json'
      - '.github/workflows/manual-official-website-retry.yml'
permissions:
  contents: read
concurrency:
  group: weddingrank-manual-official-website-retry
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install --no-save @supabase/supabase-js@2.57.4
      - name: Apply only guarded official WeddingRank website corrections
        env:
          SUPABASE_URL: https://mozmxkmaynhxqwzovzhi.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/apply-verified-wedding-patches.cjs research/patches/2026-10-12-retry-official-websites.json
