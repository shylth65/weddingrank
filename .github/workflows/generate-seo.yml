name: Generate venue and area SEO pages

on:
  workflow_dispatch:
  schedule:
    - cron: '10 18 * * *'
  push:
    paths:
      - 'scripts/generate-seo.mjs'
      - 'scripts/generate-regions.mjs'
      - '.github/workflows/generate-seo.yml'

permissions:
  contents: write

concurrency:
  group: generate-seo
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate venue and area pages and sitemap
        run: node scripts/generate-seo.mjs
      - name: Generate dynamic regions hub
        run: node scripts/generate-regions.mjs
      - name: Commit generated SEO pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add venue area sitemap.xml regions.html
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Generate venue and area SEO pages [skip seo]"
          git push
