name: Generate venue SEO pages

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/generate-seo.mjs'
      - '.github/workflows/generate-seo.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate venue pages and sitemap
        run: node scripts/generate-seo.mjs
      - name: Commit generated SEO pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add venue sitemap.xml
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Generate venue SEO pages [skip seo]"
          git push
