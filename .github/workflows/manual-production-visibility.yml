name: WeddingRank manual production visibility verification
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/verify-production-visibility.cjs'
      - '.github/workflows/manual-production-visibility.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install --no-save @supabase/supabase-js@2.57.4
      - name: Compare actual live site with WeddingRank specialist database
        env:
          SUPABASE_URL: https://mozmxkmaynhxqwzovzhi.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/verify-production-visibility.cjs
      - name: Preserve proof whether successful or incomplete
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: weddingrank-live-production-qa
          path: weddingrank-live-qa.json
          retention-days: 14
