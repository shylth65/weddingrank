<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>WeddingRank - 서비스 준비중</title>

  <meta name="description"
        content="WeddingRank는 PICKRANK 통합 플랫폼 고도화를 위해 서비스 개편 작업 중입니다." />

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #f7f8fa;
      font-family: Arial, "Malgun Gothic", sans-serif;
      color: #222;
    }

    .container {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }

    .box {
      background: white;
      padding: 60px 40px;
      border-radius: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 500px;
      box-sizing: border-box;
    }

    h1 {
      font-size: 32px;
      margin: 0 0 30px;
    }

    p {
      font-size: 18px;
      line-height: 1.7;
      color: #555;
    }

    .footer {
      margin-top: 35px;
      font-size: 14px;
      color: #888;
    }

    @media (max-width: 600px) {
      .box {
        padding: 45px 25px;
      }

      h1 {
        font-size: 27px;
      }

      p {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="box">

      <h1>💍 WeddingRank<br>서비스 준비중</h1>

      <p>
        WeddingRank는<br>
        PICKRANK 통합 플랫폼 고도화를 위해<br>
        서비스 개편 작업을 진행 중입니다.
      </p>

      <p>
        더욱 정확한 예식장 정보와<br>
        평가·추천 서비스를 준비하겠습니다.
      </p>

      <div class="footer">
        © WeddingRank
      </div>

    </div>
  </div>

</body>

</html>
