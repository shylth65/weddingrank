<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>WeddingRank 관리자</title><link rel="stylesheet" href="style.css?v=5.10"><style>body{background:#f7f7f5}.admin{max-width:1200px;margin:auto;padding:32px 18px}.adminTop{display:flex;justify-content:space-between;gap:12px;align-items:center}.adminCard{background:#fff;border:1px solid #e8e8e4;border-radius:16px;padding:18px;margin-top:18px}.loginBox{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.loginBox input{min-height:44px;min-width:260px;flex:1;border:1px solid #ddd;border-radius:10px;padding:0 12px;font-size:16px}.loginBox button,.adminTools button{min-height:42px;border:0;border-radius:10px;padding:0 14px;background:#ef5d87;color:#fff;font-weight:800}.adminTools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:14px 0}.adminTools select{min-height:42px;border:1px solid #ddd;border-radius:10px;background:#fff;padding:0 12px}.adminTable{width:100%;border-collapse:collapse}.adminTable th,.adminTable td{padding:10px;border-bottom:1px solid #eee;text-align:left;vertical-align:top}.adminTable select{min-height:38px}.muted{color:#777}.error{color:#b42318;white-space:pre-wrap;word-break:break-word}.saved{font-size:12px;color:#555;margin-top:4px}.newRow{background:#fff8fa}@media(max-width:760px){.admin{padding:18px 10px 40px}.adminTop h1{font-size:24px}.adminCard{padding:12px;overflow:auto}.adminTable{font-size:13px;min-width:850px}.loginBox input{min-width:100%;width:100%}.loginBox button{width:100%;min-height:46px}}</style></head><body><main class="admin"><div class="adminTop"><div><h1>WeddingRank 관리자</h1><p class="muted">관리자 로그인 · 상담신청 관리</p></div><a href="./">사이트로 돌아가기</a></div><div class="adminCard" id="auth">로그인 정보를 확인하는 중…</div><div class="adminCard"><div id="summary" class="muted">관리자 인증 후 상담 데이터를 표시합니다.</div><div class="adminTools"><select id="statusFilter"><option value="">전체 상태</option><option>신규</option><option>확인</option><option>상담중</option><option>완료</option><option>취소</option></select><button id="refreshBtn" type="button">새로고침</button><span id="lastLoaded" class="muted"></span></div><div id="list"></div></div></main><script src="config.js?v=5.22"></script><script>
(()=>{const C=window.WEDDINGRANK_CONFIG||{},base=String(C.SUPABASE_URL||'').replace(/\/+$/,''),key=C.SUPABASE_ANON_KEY||C.SUPABASE_PUBLISHABLE_KEY||C.SUPABASE_KEY||'';const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let token=localStorage.getItem('wr_access_token')||'',allRows=[],names=new Map();function clearSession(){['wr_access_token','wr_refresh_token','wr_expires_at'].forEach(k=>localStorage.removeItem(k));token=''}function captureSessionFromUrl(){const h=new URLSearchParams(location.hash.replace(/^#/,'')),q=new URLSearchParams(location.search),access=h.get('access_token')||q.get('access_token'),refresh=h.get('refresh_token')||q.get('refresh_token'),expires=Number(h.get('expires_in')||q.get('expires_in')||0);if(access){token=access;localStorage.setItem('wr_access_token',access);if(refresh)localStorage.setItem('wr_refresh_token',refresh);if(expires)localStorage.setItem('wr_expires_at',String(Date.now()+expires*1000));history.replaceState(null,'',location.pathname);return true}return false}function showLogin(msg='관리자 이메일로 로그인 링크를 받으세요.'){$('#auth').innerHTML=`<b>관리자 로그인</b><p class="muted">${esc(msg)}</p><div class="loginBox"><input id="adminEmail" type="email" inputmode="email" autocomplete="email" placeholder="관리자 이메일"><button id="adminLogin" type="button">로그인 링크 받기</button></div><div id="loginMsg" class="muted" style="margin-top:8px"></div>`;$('#adminLogin').onclick=sendLogin;$('#adminEmail').onkeydown=e=>{if(e.key==='Enter')sendLogin()}}async function sendLogin(){const email=($('#adminEmail')?.value||'').trim(),msg=$('#loginMsg'),btn=$('#adminLogin');if(!email||!email.includes('@')){msg.textContent='이메일 주소를 확인해주세요.';return}btn.disabled=true;msg.className='muted';msg.textContent='로그인 메일을 보내는 중…';try{const redirect=location.origin+location.pathname,url=base+'/auth/v1/otp?redirect_to='+encodeURIComponent(redirect),r=await fetch(url,{method:'POST',headers:{apikey:key,'Content-Type':'application/json'},body:JSON.stringify({email,create_user:false})});const raw=await r.text();if(!r.ok)throw new Error('HTTP '+r.status+' '+r.statusText+(raw?'\n'+raw:''));msg.textContent='로그인 링크를 이메일로 보냈습니다. 메일의 링크를 누르면 이 관리자 화면으로 돌아옵니다.'}catch(e){msg.className='error';msg.textContent='로그인 메일 전송 실패\n'+(e&&e.message?e.message:String(e));console.warn(e)}finally{btn.disabled=false}}async function refresh(){const rt=localStorage.getItem('wr_refresh_token'),exp=Number(localStorage.getItem('wr_expires_at')||0);if(!rt)return !!token;if(token&&exp&&exp-Date.now()>5*60*1000)return true;try{const r=await fetch(base+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:key,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:rt})}),d=await r.json();if(!r.ok||!d.access_token)throw new Error();token=d.access_token;localStorage.setItem('wr_access_token',token);if(d.refresh_token)localStorage.setItem('wr_refresh_token',d.refresh_token);if(d.expires_in)localStorage.setItem('wr_expires_at',String(Date.now()+Number(d.expires_in)*1000));return true}catch(e){clearSession();return false}}async function req(path,opt={}){const r=await fetch(base+'/rest/v1/'+path,{...opt,headers:{apikey:key,Authorization:'Bearer '+token,'Content-Type':'application/json',...(opt.headers||{})}});if(!r.ok)throw new Error(await r.text());return r.status===204?null:r.json()}function render(){const f=$('#statusFilter').value,rows=f?allRows.filter(x=>x.status===f):allRows,counts={};allRows.forEach(x=>counts[x.status]=(counts[x.status]||0)+1);$('#summary').textContent=`전체 ${allRows.length}건 · 신규 ${counts['신규']||0} · 확인 ${counts['확인']||0} · 상담중 ${counts['상담중']||0} · 완료 ${counts['완료']||0} · 취소 ${counts['취소']||0}${f?` · 현재 ${rows.length}건 표시`:''}`;if(!rows.length){$('#list').innerHTML='<p>해당 상담신청이 없습니다.</p>';return}$('#list').innerHTML='<table class="adminTable"><thead><tr><th>신청일</th><th>예식장</th><th>신청자</th><th>연락처</th><th>희망일/인원</th><th>문의</th><th>상태</th></tr></thead><tbody>'+rows.map(x=>`<tr class="${x.status==='신규'?'newRow':''}"><td>${esc(String(x.created_at||'').replace('T',' ').slice(0,16))}</td><td>${esc(names.get(x.hall_id)||'예식장 확인중')}</td><td>${esc(x.customer_name)}</td><td><a href="tel:${esc(String(x.phone||'').replace(/[^0-9+]/g,''))}">${esc(x.phone)}</a></td><td>${esc(x.preferred_date||'-')}<br>${x.guest_count?esc(x.guest_count)+'명':'-'}</td><td>${esc(x.message||'-')}</td><td><select data-id="${esc(x.request_id)}">${['신규','확인','상담중','완료','취소'].map(s=>`<option${s===x.status?' selected':''}>${s}</option>`).join('')}</select><div class="saved" data-save="${esc(x.request_id)}"></div></td></tr>`).join('')+'</tbody></table>';document.querySelectorAll('select[data-id]').forEach(s=>s.onchange=async()=>{const note=document.querySelector(`[data-save="${CSS.escape(s.dataset.id)}"]`),row=allRows.find(x=>x.request_id===s.dataset.id),old=row?.status;s.disabled=true;if(note)note.textContent='저장중…';try{await req('consultation_requests?request_id=eq.'+encodeURIComponent(s.dataset.id),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({status:s.value})});if(row)row.status=s.value;if(note)note.textContent='저장됨';setTimeout(render,450)}catch(e){s.value=old||'신규';if(note)note.textContent='저장 실패'}finally{s.disabled=false}})}async function load(){captureSessionFromUrl();if(!(await refresh())){showLogin();$('#summary').textContent='관리자 인증 후 상담 데이터를 표시합니다.';return}try{allRows=await req('consultation_requests?select=request_id,hall_id,customer_name,phone,preferred_date,guest_count,message,status,created_at&order=created_at.desc&limit=500');const ids=[...new Set(allRows.map(x=>x.hall_id).filter(Boolean))];names=new Map();if(ids.length){try{const hs=await req('wedding_halls?select=hall_id,name&hall_id=in.('+ids.map(encodeURIComponent).join(',')+')');hs.forEach(h=>names.set(h.hall_id,h.name))}catch(e){}}$('#auth').innerHTML='<b>관리자 인증 완료</b><p class="muted">상담신청 정보를 안전하게 관리할 수 있습니다.</p>';$('#lastLoaded').textContent='마지막 갱신 '+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});render()}catch(e){clearSession();showLogin('관리자 권한이 확인되지 않았습니다. 허용된 관리자 이메일로 로그인해주세요.');$('#summary').textContent='접근 권한 없음';$('#list').innerHTML=''}}$('#statusFilter').addEventListener('change',render);$('#refreshBtn').addEventListener('click',load);load()})();
</script></body></html>
