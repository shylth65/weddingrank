<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>WeddingRank 관리자</title><link rel="stylesheet" href="style.css?v=5.10"><style>body{background:#f7f7f5}.admin{max-width:1100px;margin:auto;padding:32px 18px}.adminTop{display:flex;justify-content:space-between;gap:12px;align-items:center}.adminCard{background:#fff;border:1px solid #e8e8e4;border-radius:16px;padding:18px;margin-top:18px}.adminTable{width:100%;border-collapse:collapse}.adminTable th,.adminTable td{padding:10px;border-bottom:1px solid #eee;text-align:left;vertical-align:top}.adminTable select{min-height:38px}.muted{color:#777}.error{color:#b42318}@media(max-width:760px){.adminTable{font-size:13px}.adminCard{overflow:auto}}</style></head><body><main class="admin"><div class="adminTop"><div><h1>WeddingRank 관리자</h1><p class="muted">상담신청 관리</p></div><a href="./">사이트로 돌아가기</a></div><div class="adminCard" id="auth">로그인 정보를 확인하는 중…</div><div class="adminCard"><div id="summary" class="muted">상담 데이터를 불러오는 중…</div><div id="list"></div></div></main><script src="config.js?v=5.13"></script><script>
(()=>{const C=window.WEDDINGRANK_CONFIG||{},base=String(C.SUPABASE_URL||'').replace(/\/+$/,''),key=C.SUPABASE_ANON_KEY||C.SUPABASE_PUBLISHABLE_KEY||C.SUPABASE_KEY||'';const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let token=localStorage.getItem('wr_access_token')||'';async function req(path,opt={}){const r=await fetch(base+'/rest/v1/'+path,{...opt,headers:{apikey:key,Authorization:'Bearer '+token,'Content-Type':'application/json',...(opt.headers||{})}});if(!r.ok)throw new Error(await r.text());return r.status===204?null:r.json()}async function load(){if(!token){$('#auth').innerHTML='<b>관리자 로그인이 필요합니다.</b><p>메인 사이트에서 관리자 계정으로 로그인한 뒤 다시 접속하세요.</p>';$('#summary').textContent='접근 권한 없음';return}try{const rows=await req('consultation_requests?select=request_id,hall_id,customer_name,phone,preferred_date,guest_count,message,status,created_at&order=created_at.desc&limit=500');$('#auth').innerHTML='<b>관리자 인증 완료</b>';const counts={};rows.forEach(x=>counts[x.status]=(counts[x.status]||0)+1);$('#summary').textContent=`전체 ${rows.length}건 · 신규 ${counts['신규']||0} · 상담중 ${counts['상담중']||0} · 완료 ${counts['완료']||0}`;if(!rows.length){$('#list').innerHTML='<p>현재 상담신청이 없습니다.</p>';return}$('#list').innerHTML='<table class="adminTable"><thead><tr><th>신청일</th><th>신청자</th><th>연락처</th><th>희망일/인원</th><th>문의</th><th>상태</th></tr></thead><tbody>'+rows.map(x=>`<tr><td>${esc(String(x.created_at||'').slice(0,10))}</td><td>${esc(x.customer_name)}</td><td>${esc(x.phone)}</td><td>${esc(x.preferred_date||'-')}<br>${x.guest_count?esc(x.guest_count)+'명':'-'}</td><td>${esc(x.message||'-')}</td><td><select data-id="${esc(x.request_id)}">${['신규','확인','상담중','완료','취소'].map(s=>`<option${s===x.status?' selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')+'</tbody></table>';document.querySelectorAll('select[data-id]').forEach(s=>s.onchange=async()=>{s.disabled=true;try{await req('consultation_requests?request_id=eq.'+encodeURIComponent(s.dataset.id),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({status:s.value})})}catch(e){alert('상태 변경 권한이 없거나 저장에 실패했습니다.');console.warn(e)}finally{s.disabled=false}})}catch(e){$('#auth').innerHTML='<b class="error">관리자 권한을 확인할 수 없습니다.</b><p>허용된 관리자 계정만 상담정보를 볼 수 있습니다.</p>';$('#summary').textContent='접근 권한 없음';$('#list').innerHTML='';console.warn(e)}}load()})();
</script></body></html>
