<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>WeddingRank 관리자</title><link rel="stylesheet" href="style.css?v=5.10"><style>body{background:#f7f7f5}.admin{max-width:1280px;margin:auto;padding:32px 18px}.adminTop{display:flex;justify-content:space-between;gap:12px;align-items:center}.adminCard{background:#fff;border:1px solid #e8e8e4;border-radius:16px;padding:18px;margin-top:18px}.adminCard h2{margin:0 0 5px}.loginBox,.adminTools,.priceEditGrid{display:flex;gap:8px;flex-wrap:wrap}.loginBox{margin-top:12px}.loginBox input,.priceEditGrid input,.priceEditGrid textarea{min-height:42px;border:1px solid #ddd;border-radius:10px;padding:8px 10px;font-size:14px}.loginBox input{min-width:260px;flex:1;font-size:16px}.loginBox button,.adminTools button,.editBtn,.savePriceBtn{min-height:42px;border:0;border-radius:10px;padding:0 14px;background:#ef5d87;color:#fff;font-weight:800;cursor:pointer}.adminTools{align-items:center;margin:14px 0}.adminTools select,.adminTable select{min-height:40px;border:1px solid #ddd;border-radius:10px;background:#fff;padding:0 10px}.adminTable{width:100%;border-collapse:collapse}.adminTable th,.adminTable td{padding:10px;border-bottom:1px solid #eee;text-align:left;vertical-align:top}.muted{color:#777}.error{color:#b42318;white-space:pre-wrap;word-break:break-word}.saved{font-size:12px;color:#555;margin-top:4px}.newRow{background:#fff8fa}.evidence{max-width:220px;word-break:break-all}.editBtn{background:#555;min-height:34px;margin-top:6px}.priceEditor{display:none;margin-top:10px;padding:12px;border:1px solid #eadfdb;border-radius:12px;background:#fff}.priceEditor.open{display:block}.priceEditGrid label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;min-width:150px;flex:1}.priceEditGrid .wide{min-width:260px;flex:2}.priceEditGrid textarea{min-height:70px;resize:vertical}.editorActions{display:flex;gap:8px;align-items:center;margin-top:10px}.editorStatus{font-size:12px;color:#666}.currentPrice{font-size:12px;line-height:1.5;color:#666;margin-top:5px}.badge{display:inline-block;border-radius:999px;padding:3px 7px;background:#f3efed;font-size:11px;font-weight:800}@media(max-width:760px){.admin{padding:18px 10px 40px}.adminTop h1{font-size:24px}.adminCard{padding:12px;overflow:auto}.adminTable{font-size:13px;min-width:980px}.loginBox input{min-width:100%;width:100%}.loginBox button{width:100%;min-height:46px}}</style></head><body><main class="admin"><div class="adminTop"><div><h1>WeddingRank 관리자</h1><p class="muted">관리자 로그인 · 가격정보 정정 · 상담신청 관리</p></div><a href="./">사이트로 돌아가기</a></div><div class="adminCard" id="auth">로그인 정보를 확인하는 중…</div><div class="adminCard"><h2>가격정보 수정요청</h2><div id="priceSummary" class="muted">관리자 인증 후 표시합니다.</div><div class="adminTools"><select id="priceStatusFilter"><option value="">전체 상태</option><option>신규</option><option>확인중</option><option>반영</option><option>보류</option><option>종결</option></select><button id="priceRefreshBtn" type="button">새로고침</button></div><div id="priceList"></div></div><div class="adminCard"><h2>예식 상담신청</h2><div id="summary" class="muted">관리자 인증 후 상담 데이터를 표시합니다.</div><div class="adminTools"><select id="statusFilter"><option value="">전체 상태</option><option>신규</option><option>확인</option><option>상담중</option><option>완료</option><option>취소</option></select><button id="refreshBtn" type="button">새로고침</button><span id="lastLoaded" class="muted"></span></div><div id="list"></div></div></main><script src="config.js?v=5.22"></script><script>
(()=>{const C=window.WEDDINGRANK_CONFIG||{},base=String(C.SUPABASE_URL||'').replace(/\/+$/,''),key=C.SUPABASE_ANON_KEY||C.SUPABASE_PUBLISHABLE_KEY||C.SUPABASE_KEY||'';const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let token=localStorage.getItem('wr_access_token')||'',allRows=[],priceRows=[],names=new Map(),latestPrices=new Map();const today=()=>new Date().toISOString().slice(0,10);function clearSession(){['wr_access_token','wr_refresh_token','wr_expires_at'].forEach(k=>localStorage.removeItem(k));token=''}function captureSessionFromUrl(){const h=new URLSearchParams(location.hash.replace(/^#/,'')),q=new URLSearchParams(location.search),access=h.get('access_token')||q.get('access_token'),refresh=h.get('refresh_token')||q.get('refresh_token'),expires=Number(h.get('expires_in')||q.get('expires_in')||0);if(access){token=access;localStorage.setItem('wr_access_token',access);if(refresh)localStorage.setItem('wr_refresh_token',refresh);if(expires)localStorage.setItem('wr_expires_at',String(Date.now()+expires*1000));history.replaceState(null,'',location.pathname);return true}return false}function showLogin(msg='관리자 이메일로 로그인 링크를 받으세요.'){$('#auth').innerHTML=`<b>관리자 로그인</b><p class="muted">${esc(msg)}</p><div class="loginBox"><input id="adminEmail" type="email" placeholder="관리자 이메일"><button id="adminLogin" type="button">로그인 링크 받기</button></div><div id="loginMsg" class="muted" style="margin-top:8px"></div>`;$('#adminLogin').onclick=sendLogin;$('#adminEmail').onkeydown=e=>{if(e.key==='Enter')sendLogin()}}async function sendLogin(){const email=($('#adminEmail')?.value||'').trim(),msg=$('#loginMsg'),btn=$('#adminLogin');if(!email||!email.includes('@')){msg.textContent='이메일 주소를 확인해주세요.';return}btn.disabled=true;msg.textContent='로그인 메일을 보내는 중…';try{const redirect=location.origin+location.pathname,r=await fetch(base+'/auth/v1/otp?redirect_to='+encodeURIComponent(redirect),{method:'POST',headers:{apikey:key,'Content-Type':'application/json'},body:JSON.stringify({email,create_user:false})});if(!r.ok)throw new Error(await r.text());msg.textContent='로그인 링크를 이메일로 보냈습니다.'}catch(e){msg.className='error';msg.textContent='로그인 메일 전송 실패\n'+e.message}finally{btn.disabled=false}}async function refresh(){const rt=localStorage.getItem('wr_refresh_token'),exp=Number(localStorage.getItem('wr_expires_at')||0);if(!rt)return !!token;if(token&&exp&&exp-Date.now()>300000)return true;try{const r=await fetch(base+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:key,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:rt})}),d=await r.json();if(!r.ok||!d.access_token)throw new Error();token=d.access_token;localStorage.setItem('wr_access_token',token);if(d.refresh_token)localStorage.setItem('wr_refresh_token',d.refresh_token);if(d.expires_in)localStorage.setItem('wr_expires_at',String(Date.now()+Number(d.expires_in)*1000));return true}catch(e){clearSession();return false}}async function req(path,opt={}){const r=await fetch(base+'/rest/v1/'+path,{...opt,headers:{apikey:key,Authorization:'Bearer '+token,'Content-Type':'application/json',...(opt.headers||{})}});if(!r.ok)throw new Error(await r.text());if(r.status===204)return null;const t=await r.text();return t?JSON.parse(t):null}
function renderConsult(){const f=$('#statusFilter').value,rows=f?allRows.filter(x=>x.status===f):allRows,counts={};allRows.forEach(x=>counts[x.status]=(counts[x.status]||0)+1);$('#summary').textContent=`전체 ${allRows.length}건 · 신규 ${counts['신규']||0} · 확인 ${counts['확인']||0} · 상담중 ${counts['상담중']||0} · 완료 ${counts['완료']||0} · 취소 ${counts['취소']||0}`;if(!rows.length){$('#list').innerHTML='<p>해당 상담신청이 없습니다.</p>';return}$('#list').innerHTML='<table class="adminTable"><thead><tr><th>신청일</th><th>예식장</th><th>신청자</th><th>연락처</th><th>희망일/인원</th><th>문의</th><th>상태</th></tr></thead><tbody>'+rows.map(x=>`<tr class="${x.status==='신규'?'newRow':''}"><td>${esc(String(x.created_at||'').replace('T',' ').slice(0,16))}</td><td>${esc(names.get(x.hall_id)||'예식장 확인중')}</td><td>${esc(x.customer_name)}</td><td>${esc(x.phone)}</td><td>${esc(x.preferred_date||'-')}<br>${x.guest_count?esc(x.guest_count)+'명':'-'}</td><td>${esc(x.message||'-')}</td><td><select data-consult-id="${esc(x.request_id)}">${['신규','확인','상담중','완료','취소'].map(s=>`<option${s===x.status?' selected':''}>${s}</option>`).join('')}</select><div class="saved" data-consult-save="${esc(x.request_id)}"></div></td></tr>`).join('')+'</tbody></table>';document.querySelectorAll('select[data-consult-id]').forEach(s=>s.onchange=()=>saveStatus('consultation_requests',s.dataset.consultId,s.value,allRows,'consult',renderConsult,false))}
function priceSummaryText(p){if(!p)return '등록된 가격정보 없음';return `기준일 ${esc(p.effective_date||'-')} · 대관 ${p.rental_fee==null?'확인중':Number(p.rental_fee).toLocaleString()+'원'} · 식대 ${p.meal_price_per_person==null?'확인중':Number(p.meal_price_per_person).toLocaleString()+'원'} · 최소보증 ${p.minimum_guarantee==null?'확인중':Number(p.minimum_guarantee).toLocaleString()+'명'}`}
function editorHtml(x){const p=latestPrices.get(x.hall_id)||{};return `<div class="priceEditor" data-editor="${esc(x.request_id)}"><div class="currentPrice"><span class="badge">현재 공개가격</span> ${priceSummaryText(p)}</div><div class="priceEditGrid"><label>가격 기준일<input data-f="effective_date" type="date" value="${esc(p.effective_date||today())}"></label><label>대관료(원)<input data-f="rental_fee" type="number" min="0" step="1000" value="${p.rental_fee??''}"></label><label>1인 식대(원)<input data-f="meal_price_per_person" type="number" min="0" step="100" value="${p.meal_price_per_person??''}"></label><label>최소보증인원<input data-f="minimum_guarantee" type="number" min="0" step="1" value="${p.minimum_guarantee??''}"></label><label class="wide">출처명<input data-f="source_name" value="${esc(p.source_name||'')}"></label><label class="wide">출처 URL<input data-f="source_url" value="${esc(p.source_url||x.evidence_url||'')}"></label><label class="wide">비고<textarea data-f="notes">${esc(p.notes||'')}</textarea></label></div><div class="editorActions"><button type="button" class="savePriceBtn" data-save-price="${esc(x.request_id)}">가격 저장 + 요청 반영</button><span class="editorStatus" data-editor-status="${esc(x.request_id)}"></span></div></div>`}
function renderPrices(){const f=$('#priceStatusFilter').value,rows=f?priceRows.filter(x=>x.status===f):priceRows,counts={};priceRows.forEach(x=>counts[x.status]=(counts[x.status]||0)+1);$('#priceSummary').textContent=`전체 ${priceRows.length}건 · 신규 ${counts['신규']||0} · 확인중 ${counts['확인중']||0} · 반영 ${counts['반영']||0} · 보류 ${counts['보류']||0} · 종결 ${counts['종결']||0}`;if(!rows.length){$('#priceList').innerHTML='<p>해당 가격정보 수정요청이 없습니다.</p>';return}$('#priceList').innerHTML='<table class="adminTable"><thead><tr><th>접수일</th><th>예식장</th><th>관계/항목</th><th>수정 요청</th><th>근거자료</th><th>현재가격/수정</th><th>상태</th></tr></thead><tbody>'+rows.map(x=>`<tr class="${x.status==='신규'?'newRow':''}"><td>${esc(String(x.created_at||'').replace('T',' ').slice(0,16))}</td><td>${esc(names.get(x.hall_id)||'예식장 확인중')}</td><td>${esc(x.relationship)}<br><b>${esc(x.correction_type)}</b></td><td>${esc(x.requested_info)}${x.current_info?`<div class="muted">현재 제보값: ${esc(x.current_info)}</div>`:''}</td><td class="evidence">${x.evidence_url?`<a href="${esc(x.evidence_url)}" target="_blank" rel="noopener noreferrer">자료 열기 ↗</a>`:'-'}</td><td><div class="currentPrice">${priceSummaryText(latestPrices.get(x.hall_id))}</div><button type="button" class="editBtn" data-edit="${esc(x.request_id)}">가격 수정</button>${editorHtml(x)}</td><td><select data-price-id="${esc(x.request_id)}">${['신규','확인중','반영','보류','종결'].map(s=>`<option${s===x.status?' selected':''}>${s}</option>`).join('')}</select><div class="saved" data-price-save="${esc(x.request_id)}"></div></td></tr>`).join('')+'</tbody></table>';document.querySelectorAll('select[data-price-id]').forEach(s=>s.onchange=()=>saveStatus('price_correction_requests',s.dataset.priceId,s.value,priceRows,'price',renderPrices,true));document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>document.querySelector(`[data-editor="${CSS.escape(b.dataset.edit)}"]`)?.classList.toggle('open'));document.querySelectorAll('[data-save-price]').forEach(b=>b.onclick=()=>savePriceFromCorrection(b.dataset.savePrice))}
async function saveStatus(table,id,status,arr,prefix,rerender,reviewed){const sel=document.querySelector(`select[data-${prefix}-id="${CSS.escape(id)}"]`),note=document.querySelector(`[data-${prefix}-save="${CSS.escape(id)}"]`),row=arr.find(x=>x.request_id===id),old=row?.status;if(sel)sel.disabled=true;if(note)note.textContent='저장중…';try{const body={status};if(reviewed)body.reviewed_at=new Date().toISOString();await req(`${table}?request_id=eq.${encodeURIComponent(id)}`,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify(body)});if(row)row.status=status;if(note)note.textContent='저장됨';setTimeout(rerender,350)}catch(e){if(sel)sel.value=old||'신규';if(note)note.textContent='저장 실패'}finally{if(sel)sel.disabled=false}}
function numOrNull(v){const t=String(v??'').trim();if(t==='')return null;const n=Number(t);return Number.isFinite(n)?n:null}
async function savePriceFromCorrection(id){const correction=priceRows.find(x=>x.request_id===id),ed=document.querySelector(`[data-editor="${CSS.escape(id)}"]`),status=document.querySelector(`[data-editor-status="${CSS.escape(id)}"]`),btn=document.querySelector(`[data-save-price="${CSS.escape(id)}"]`);if(!correction||!ed)return;const get=f=>ed.querySelector(`[data-f="${f}"]`)?.value??'',body={hall_id:correction.hall_id,effective_date:get('effective_date')||today(),rental_fee:numOrNull(get('rental_fee')),meal_price_per_person:numOrNull(get('meal_price_per_person')),minimum_guarantee:numOrNull(get('minimum_guarantee')),source_name:get('source_name').trim()||null,source_url:get('source_url').trim()||null,verified_at:today(),notes:get('notes').trim()||null};btn.disabled=true;status.textContent='가격 저장중…';try{const existing=latestPrices.get(correction.hall_id);let saved;if(existing?.price_id){saved=await req(`wedding_prices?price_id=eq.${encodeURIComponent(existing.price_id)}`,{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify(body)});saved=saved?.[0]}else{saved=await req('wedding_prices',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify(body)});saved=saved?.[0]}if(saved)latestPrices.set(correction.hall_id,saved);await req(`price_correction_requests?request_id=eq.${encodeURIComponent(id)}`,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({status:'반영',reviewed_at:new Date().toISOString(),admin_note:'관리자 가격정보 반영 완료'})});correction.status='반영';status.textContent='가격 저장 및 반영 완료';setTimeout(renderPrices,500)}catch(e){console.error(e);status.textContent='저장 실패: '+(e.message||e)}finally{btn.disabled=false}}
async function load(){captureSessionFromUrl();if(!(await refresh())){showLogin();return}try{[allRows,priceRows]=await Promise.all([req('consultation_requests?select=request_id,hall_id,customer_name,phone,preferred_date,guest_count,message,status,created_at&order=created_at.desc&limit=500'),req('price_correction_requests?select=request_id,hall_id,relationship,correction_type,current_info,requested_info,evidence_url,contact,status,created_at,reviewed_at&order=created_at.desc&limit=500')]);const ids=[...new Set([...allRows,...priceRows].map(x=>x.hall_id).filter(Boolean))];names=new Map();latestPrices=new Map();if(ids.length){const inIds=ids.map(encodeURIComponent).join(','),[hs,ps]=await Promise.all([req('wedding_halls?select=hall_id,name&hall_id=in.('+inIds+')'),req('wedding_prices?select=price_id,hall_id,effective_date,rental_fee,meal_price_per_person,minimum_guarantee,source_name,source_url,verified_at,notes&hall_id=in.('+inIds+')&order=effective_date.desc,verified_at.desc')]);hs.forEach(h=>names.set(h.hall_id,h.name));ps.forEach(p=>{if(!latestPrices.has(p.hall_id))latestPrices.set(p.hall_id,p)})}$('#auth').innerHTML='<b>관리자 인증 완료</b><p class="muted">정정요청에서 가격을 직접 수정하고 즉시 반영할 수 있습니다.</p>';$('#lastLoaded').textContent='마지막 갱신 '+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});renderConsult();renderPrices()}catch(e){console.error(e);clearSession();showLogin('관리자 권한이 확인되지 않았습니다. 허용된 관리자 이메일로 로그인해주세요.');$('#summary').textContent=$('#priceSummary').textContent='접근 권한 없음';$('#list').innerHTML=$('#priceList').innerHTML=''}}$('#statusFilter').addEventListener('change',renderConsult);$('#priceStatusFilter').addEventListener('change',renderPrices);$('#refreshBtn').addEventListener('click',load);$('#priceRefreshBtn').addEventListener('click',load);load()})();
</script></body></html>
